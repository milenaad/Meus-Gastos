<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meus Gastos</title>
<meta name="theme-color" content="#0a7f78">
<meta name="description" content="Controle de contas, cartões, receitas e despesas pessoais e da empresa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meus Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de coluna única (até 480px). Topo com troca Pessoal/Empresa, quatro abas (Resumo, Lançamentos, Planejar, Mais) e botão flutuante "Novo lançamento". A cor fica nos gráficos; a interface é grafite e papel. */
:root {
  --bg: #f3f3f0; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6b6963;
  --grid: #e1e0d9; --axis: #c3c2b7; --line: rgba(11,11,11,.10); --danger: #b32f2f;
  --other: #a9a79f; --other2: #cfcdc5; --warn: #fab219; --crit: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #a3a29a;
    --grid: #2c2c2a; --axis: #383835; --line: rgba(255,255,255,.10); --danger: #ef7a7a;
    --other: #6a6963; --other2: #47463f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #a3a29a;
  --grid: #2c2c2a; --axis: #383835; --line: rgba(255,255,255,.10); --danger: #ef7a7a;
  --other: #6a6963; --other2: #47463f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
/* Cor de cada lado: Pessoal = verde-água, Empresa = roxo. Muda faixa do topo, fundo, botões e abas. */
:root[data-ctx="pessoal"] { --accent: #0a7f78; --on: #ffffff; --bg: #e6f4f2; --surface: #fbfefd; --s1: #0a7f78; }
:root[data-ctx="empresa"] { --accent: #6b2fc9; --on: #ffffff; --bg: #efe9fa; --surface: #fdfcff; --s1: #6b2fc9; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-ctx="pessoal"] { --accent: #35d0c4; --on: #06201e; --bg: #06100f; --surface: #0f1f1d; --s1: #35d0c4; }
  :root:not([data-theme="light"])[data-ctx="empresa"] { --accent: #a98cf2; --on: #170a33; --bg: #0b0714; --surface: #1a1229; --s1: #a98cf2; }
}
:root[data-theme="dark"][data-ctx="pessoal"] { --accent: #35d0c4; --on: #06201e; --bg: #06100f; --surface: #0f1f1d; --s1: #35d0c4; }
:root[data-theme="dark"][data-ctx="empresa"] { --accent: #a98cf2; --on: #170a33; --bg: #0b0714; --surface: #1a1229; --s1: #a98cf2; }
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--accent); z-index: 40; }
.ctxpill { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--on); font-family: var(--body); font-size: 12px; font-weight: 600; letter-spacing: 0; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 170px; }

.top { display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -.01em; }
.note { font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg.seg3 { grid-template-columns: repeat(3, 1fr); }
.seg button { border: 0; background: none; border-radius: 9px; padding: 10px 6px; font-weight: 600; color: var(--ink2); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on); }

.pbar { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--axis); background: none; border-radius: 999px; padding: 6px 14px; font-weight: 500; color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on); }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.navlab { flex: 1; text-align: center; font-family: var(--display); font-weight: 600; font-size: 17px; }
.ico { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.hero { margin-top: 18px; }
.hero .lab { color: var(--ink2); font-size: 14px; }
.hero .big { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1.05; letter-spacing: -.02em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.hero .sub { color: var(--ink2); font-size: 14px; margin-top: 8px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.kpis .k { display: block; color: var(--ink2); font-size: 13px; }
.kpis .kv { font-family: var(--display); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 0 0 2px; }
.card .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.big2 { font-family: var(--display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }

.donutrow { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.donutrow svg { width: 168px; height: 168px; flex: none; }
.legend { width: 100%; display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--grid); padding: 10px 0; min-width: 0; }
.lrow:first-child { border-top: 0; }
.dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.lrow .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.lrow .vl { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lrow .pc { color: var(--muted); font-size: 12px; display: block; }

.brow { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 0; }
.brow .tp { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.brow .nm { min-width: 0; overflow-wrap: anywhere; }
.brow .vl { white-space: nowrap; font-variant-numeric: tabular-nums; }
.brow .vl small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.track { height: 10px; background: var(--grid); border-radius: 0 5px 5px 0; }
.fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--s1); }
.fill.none { background: var(--other); }
.fill.warn { background: var(--warn); }
.fill.crit { background: var(--crit); }
.fill.good { background: var(--s3); }
.linkbtn { background: none; border: 0; padding: 8px 0 0; color: var(--ink2); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.stat { color: var(--ink2); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.item { padding: 10px 0; border-top: 1px solid var(--grid); }
.item:first-of-type { border-top: 0; }

.evo { display: flex; gap: 6px; height: 140px; border-bottom: 1px solid var(--axis); }
.evo .col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; background: none; border: 0; padding: 0; }
.evo .pb { display: flex; align-items: flex-end; justify-content: center; gap: 2px; width: 100%; }
.evo .b { width: 100%; max-width: 14px; border-radius: 4px 4px 0 0; min-height: 2px; }
.evo .b.r { background: var(--s3); }
.evo .b.d { background: var(--s2); }
.evo .col.dim .b { opacity: .45; }
.evol { display: flex; gap: 6px; margin-top: 6px; }
.evol span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); min-width: 0; }
.evol span.sel { color: var(--ink); font-weight: 600; }
.legendh { display: flex; gap: 16px; margin: 0 0 10px; font-size: 13px; color: var(--ink2); }
.legendh span { display: inline-flex; align-items: center; gap: 6px; }
.readout { font-size: 13px; color: var(--ink2); margin-top: 10px; font-variant-numeric: tabular-nums; }

.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 12px; }
select, textarea, input[type=text], input[type=date], input[type=number], input:not([type]) { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--axis); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; }
.sumline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; color: var(--ink2); font-size: 14px; }
.sumline strong { font-family: var(--display); font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.day { margin-top: 16px; }
.dayh { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 600; padding: 0 2px 6px; }
.daylist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--grid); padding: 12px 0; min-width: 0; }
.row:first-child { border-top: 0; }
.row .mid { flex: 1; min-width: 0; }
.row .t1 { font-weight: 600; overflow-wrap: anywhere; }
.row .t2 { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }
.row .chev { color: var(--muted); }
.row2 { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--grid); padding: 10px 0; }
.row2:first-child { border-top: 0; }
.row2 .main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; }
.row2 .mid { flex: 1; min-width: 0; }
.row2 .t1 { font-weight: 600; overflow-wrap: anywhere; }
.row2 .t2 { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row2 .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.sect { font-family: var(--display); font-weight: 600; font-size: 15px; margin: 18px 2px 8px; color: var(--ink2); }
.switch { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--grid); padding: 12px 0; }
.switch:first-child { border-top: 0; }
.switch .nm { flex: 1; }
.sw { width: 40px; height: 24px; border-radius: 999px; background: var(--axis); position: relative; flex: none; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); }
.switch[aria-pressed="true"] .sw { background: var(--accent); }
.switch[aria-pressed="true"] .sw::after { left: 19px; }
.switch .st { font-size: 13px; color: var(--muted); }

textarea { min-height: 110px; resize: vertical; }
.btnrow { display: flex; flex-direction: column; gap: 8px; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; }
.btn { border: 1px solid var(--axis); background: var(--surface); border-radius: 12px; padding: 11px 16px; font-weight: 600; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on); border-color: var(--accent); }
.btn-danger { color: var(--danger); border-color: var(--danger); background: none; }
.btn[disabled] { opacity: .5; }
.empty { text-align: center; padding: 28px 8px; color: var(--ink2); }
.empty h2 { font-family: var(--display); font-size: 20px; color: var(--ink); margin: 0 0 6px; }
.empty p { margin: 0 0 14px; }
.empty .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.foot { color: var(--muted); font-size: 13px; margin-top: 12px; }

#nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; z-index: 10; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
#nav button { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 12px; font-weight: 500; color: var(--muted); border-radius: 10px; min-width: 0; }
#nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
#fab { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); padding: 0 16px; display: flex; justify-content: flex-end; pointer-events: none; z-index: 10; }
#fab button { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: var(--accent); color: var(--on); border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.25); }

#sheet:empty { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; max-height: 92%; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 21; }
.sheet h2 { font-family: var(--display); font-size: 19px; margin: 0 0 4px; }
.sheet .ctxtag { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.sheet .seg { margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.field .tip { font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chk { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; }
.chk input { width: 20px; height: 20px; flex: none; }
.money-in { position: relative; }
.money-in span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.money-in input { padding-left: 40px; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
#toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .fill, .evo .b { transition: height .25s, width .25s; } }
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="fab"></div>
<nav id="nav" aria-label="Navegação"></nav>
<div id="sheet"></div>
<div id="toast" role="status" hidden></div>

<script>
(function () {
'use strict';
const MON = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MAB = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const DIMS = {
  cat: { key: 'categories', field: 'cat', one: 'Categoria', many: 'Categorias', title: 'Categorias de despesa', none: 'Sem categoria', newl: 'nova categoria', art: 'da' },
  icat: { key: 'incomeCats', field: 'cat', one: 'Categoria', many: 'Receitas', title: 'Categorias de receita', none: 'Sem categoria', newl: 'nova categoria', art: 'da' },
  sup: { key: 'suppliers', field: 'sup', one: 'Fornecedor', many: 'Fornecedores', title: 'Fornecedores', none: 'Sem fornecedor', newl: 'novo fornecedor', art: 'do' },
  sec: { key: 'sectors', field: 'sec', one: 'Setor', many: 'Setores', title: 'Setores', none: 'Sem setor', newl: 'novo setor', art: 'do' }
};
const CTX = { pessoal: 'Pessoal', empresa: 'Empresa' };
const TYPES = { despesa: 'Despesa', receita: 'Receita', transf: 'Transferência' };
const DASH = [['saldo', 'Saldo das contas'], ['cartoes', 'Cartões de crédito'], ['cat', 'Despesas por categoria'], ['sup', 'Despesas por fornecedor'], ['sec', 'Despesas por setor'], ['rcat', 'Receitas por categoria'], ['orc', 'Orçamento'], ['pagar', 'Contas a pagar'], ['metas', 'Metas'], ['evo', 'Receitas e despesas por mês']];
const I = {
  chart: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  target: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>',
  sliders: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  left: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>'
};

const now = new Date();
const S = { ctx: 'pessoal', tab: 'resumo', period: 'mes', y: now.getFullYear(), m: now.getMonth() + 1,
  f: { type: '', cat: '', sup: '', sec: '', acc: '' }, cad: 'acc', plan: 'orc', more: {}, loading: true, sheet: null, pend: null };
const D = { cfg: normCfg(null), expenses: [] };
try { const c0 = localStorage.getItem('financas:ctx'); if (c0 === 'empresa' || c0 === 'pessoal') S.ctx = c0; } catch (e) {}
const THEME_COLOR = { pessoal: '#0a7f78', empresa: '#6b2fc9' };
function paintCtx() { document.documentElement.setAttribute('data-ctx', S.ctx); const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', THEME_COLOR[S.ctx]); }
paintCtx();

function emptyCtx() { return { categories: [], incomeCats: [], suppliers: [], sectors: [], accounts: [], cards: [], goals: [], budgets: {}, hide: [] }; }
function normCfg(c) {
  const o = { pessoal: emptyCtx(), empresa: emptyCtx() };
  if (c && typeof c === 'object') {
    ['pessoal', 'empresa'].forEach(k => {
      const x = c[k] || {};
      ['categories', 'incomeCats', 'suppliers', 'sectors', 'accounts', 'cards', 'goals', 'hide'].forEach(n => { o[k][n] = Array.isArray(x[n]) ? x[n] : []; });
      o[k].budgets = x.budgets && typeof x.budgets === 'object' && !Array.isArray(x.budgets) ? x.budgets : {};
    });
  }
  return o;
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const cur = () => D.cfg[S.ctx];

  if (dim === 'cat' || dim === 'icat') {
    const used = arr.map(i => i.slot); let s = null;

}
function usedBy(dim, id) {

}
function balance(a) {
  let b = a.init || 0;
  ctxList().forEach(e => {
    if (!isPaid(e)) return; const t = typ(e);
    if (t === 'receita' && e.acc === a.id) b += e.cents;
    else if (t === 'despesa' && e.acc === a.id && !e.card) b -= e.cents;
    else if (t === 'transf') { if (e.acc === a.id) b -= e.cents; if (e.to === a.id) b += e.cents; }

}
function fatKey(c, ds) {
  const p = ds.split('-').map(Number); let y = p[0], m = p[1];
  if (p[2] > (c.close || 31)) { m++; if (m > 12) { m = 1; y++; } }
  return c.id + ':' + y + '-' + pad(m);
}
function fatDue(c, key) {
  const p = key.split(':')[1].split('-').map(Number); let y = p[0], m = p[1];
  if ((c.due || 1) <= (c.close || 31)) { m++; if (m > 12) { m = 1; y++; } }
  return y + '-' + pad(m) + '-' + pad(Math.min(c.due || 1, daysIn(y, m)));
}
function fatInfo(c) {

  ctxList().forEach(e => {
    if (e.card !== c.id) return; const t = typ(e);
    if (t === 'despesa') { const k = fatKey(c, e.date); (map[k] = map[k] || { key: k, total: 0, paid: 0 }).total += e.cents; }
    else if (t === 'transf' && e.fat) { (map[e.fat] = map[e.fat] || { key: e.fat, total: 0, paid: 0 }).paid += e.cents; }

}

  return Math.max(u, 0);
}
const fatLabel = key => { const p = key.split(':')[1].split('-'); return cap(MON[+p[1] - 1]) + '/' + p[0]; };

function spentIn(catId, y, m) {

}
const budgetMonth = () => S.period === 'mes' || S.tab === 'plan' ? { y: S.y, m: S.m } : { y: now.getFullYear(), m: now.getMonth() + 1 };
function matchF(e) {
  const f = S.f, t = typ(e);
  if (f.type && t !== f.type) return false;

  if (f.sup) { if (f.sup === '_') { if (t !== 'despesa' || norm('sup', e.sup)) return false; } else if (e.sup !== f.sup) return false; }
  if (f.sec) { if (f.sec === '_') { if (t !== 'despesa' || norm('sec', e.sec)) return false; } else if (e.sec !== f.sec) return false; }
  if (f.acc && e.acc !== f.acc && e.to !== f.acc && e.card !== f.acc) return false;

}

const store = {
  mode: 'local', base: null, col: null, q: Promise.resolve(),
  enqueue(fn) { const p = this.q.then(fn); this.q = p.catch(() => {}); return p; },
  async init() {
    let db = null, id = null;
    try {
      if (window.claude && window.claude.use) {
        const user = await window.claude.use('user');
        id = user ? await user.id() : null;
        db = await window.claude.use('db');
      }
    } catch (e) {}
    if (db && id) {
      this.mode = 'db';
      this.base = db.doc('data/users/' + id + '/finance');
      this.col = this.base.collection('expenses');
      let g1 = false, g2 = false;
      const fail = () => toast('A conexão com seus dados foi interrompida. Recarregue a página.');
      this.base.onSnapshot(s => {
        const d = s.exists ? s.data() : null;
        D.cfg = normCfg(d && d.cfg); g1 = true;
        if (g1 && g2) S.loading = false;
        render();
      }, fail);
      this.col.onSnapshot(s => {
        D.expenses = s.docs.map(x => { const o = Object.assign({}, x.data()); o.id = x.id; return o; })
          .filter(e => typeof e.cents === 'number' && typeof e.date === 'string' && e.ctx);
        g2 = true;
        if (g1 && g2) S.loading = false;
        render();
      }, fail);
    } else { this.mode = 'local'; loadLocal(); S.loading = false; render(); }
  },
  saveCfg() {
    if (this.mode === 'db') { const snap = JSON.parse(JSON.stringify(D.cfg)); return this.enqueue(() => this.base.set({ cfg: snap })); }
    persistLocal(); return Promise.resolve();
  },
  saveExpense(id, obj) {
    if (this.mode === 'db') return this.enqueue(() => { const ref = id ? this.col.doc(id) : this.col.doc(); return ref.set(JSON.parse(JSON.stringify(obj))); });
    if (id) { const i = D.expenses.findIndex(x => x.id === id); if (i >= 0) { obj.id = id; D.expenses[i] = obj; } }
    else { obj.id = uid(); D.expenses.push(obj); }
    persistLocal(); return Promise.resolve();
  },
  deleteExpense(id) {
    if (this.mode === 'db') return this.enqueue(() => this.col.doc(id).delete());
    D.expenses = D.expenses.filter(x => x.id !== id); persistLocal(); return Promise.resolve();
  }
};
function persistLocal() { try { localStorage.setItem('financas:v1', JSON.stringify({ cfg: D.cfg, expenses: D.expenses })); } catch (e) {} }
function loadLocal() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { const raw = localStorage.getItem('financas:v1'); if (raw) { const o = JSON.parse(raw); D.cfg = normCfg(o.cfg); D.expenses = Array.isArray(o.expenses) ? o.expenses : []; } } catch (e) {}
}

  g.forEach(x => {
    if (x.id === '') { segs.push({ id: '', name: DIMS.cat.none, total: x.total, color: 'var(--other)' }); return; }
    const it = items('cat').find(i => i.id === x.id);
    if (it && it.slot != null) segs.push({ id: x.id, name: it.name, total: x.total, color: 'var(--s' + (it.slot + 1) + ')' }); else other += x.total;
  });

}

  const r = 42, C = 2 * Math.PI * r, gap = segs.length > 1 ? 1.4 : 0; let off = 0;
  const circles = segs.map(s => {
    const len = s.total / total * C, dl = Math.max(len - gap, 0.6);
    const el = '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke-width="18" style="stroke:' + s.color + '" stroke-dasharray="' + dl.toFixed(2) + ' ' + (C - dl).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
    off += len; return el;

  const label = 'Gráfico de rosca por categoria: ' + segs.map(s => s.name + ' ' + pctText(s.total, total)).join(', ');

  if (S.period === 'ano') return Array.from({ length: 12 }, (_, i) => ({ y: S.y, m: i + 1 }));
  let endY, endM, n;
  if (S.period === 'mes') { endY = S.y; endM = S.m; n = 6; } else { endY = now.getFullYear(); endM = now.getMonth() + 1; n = 12; }
  const out = [];
  for (let i = n - 1; i >= 0; i--) { let mm = endM - i, yy = endY; while (mm < 1) { mm += 12; yy--; } out.push({ y: yy, m: mm }); }
  return out;
}
function evoCard() {
  const all = ctxList(), ms = monthsRange();
  const calc = (x, t) => { const k = x.y + '-' + pad(x.m); return sum(all.filter(e => typ(e) === t && e.date.slice(0, 7) === k)); };
  const rec = ms.map(x => calc(x, 'receita')), des = ms.map(x => calc(x, 'despesa'));
  const max = Math.max.apply(null, rec.concat(des)) || 1;
  const hh = v => v > 0 ? Math.max(3, Math.round(v / max * 100)) : 2;
  const cols = ms.map((x, i) => {
    const sel = S.period === 'mes' && x.y === S.y && x.m === S.m;
    return '<button class="col' + (S.period === 'mes' && !sel ? ' dim' : '') + '" data-act="month" data-y="' + x.y + '" data-m="' + x.m + '" aria-label="' + cap(MON[x.m - 1]) + ' de ' + x.y + ': receitas ' + brl(rec[i]) + ', despesas ' + brl(des[i]) + '"><span class="pb"><span class="b r" style="height:' + hh(rec[i]) + 'px"></span><span class="b d" style="height:' + hh(des[i]) + 'px"></span></span></button>';
  }).join('');
  const labs = ms.map(x => '<span' + (S.period === 'mes' && x.y === S.y && x.m === S.m ? ' class="sel"' : '') + '>' + MAB[x.m - 1] + '</span>').join('');
  const si = ms.findIndex(x => x.y === S.y && x.m === S.m);
  const readout = S.period === 'mes' && si >= 0 ? '<div class="readout">' + cap(MON[S.m - 1]) + ': receitas ' + brl(rec[si]) + ' · despesas ' + brl(des[si]) + '</div>' : '';
  const yrs = ms[0].y !== ms[ms.length - 1].y ? ' (' + ms[0].y + '–' + ms[ms.length - 1].y + ')' : ' (' + ms[0].y + ')';
  return cardWrap('Receitas e despesas por mês', 'Toque em um mês para abri-lo' + yrs + '.',
    '<div class="legendh"><span><i class="dot" style="background:var(--s3)"></i>Receitas</span><span><i class="dot" style="background:var(--s2)"></i>Despesas</span></div><div class="evo">' + cols + '</div><div class="evol">' + labs + '</div>' + readout);
}
function resumo() {
  const L = ctxList(), c = cur();
  if (!L.length && !c.accounts.length && !c.cards.length && !c.goals.length) return periodBar() + onboarding();
  const P = L.filter(inPeriod), DL = P.filter(e => typ(e) === 'despesa'), RL = P.filter(e => typ(e) === 'receita');
  let h = periodBar() + hero(sum(RL), sum(DL));
  if (!P.length) h += '<div class="empty"><p>Nenhum lançamento neste período.</p><div class="btns"><button class="btn btn-primary" data-act="newTx">Novo lançamento</button></div></div>';
  DASH.forEach(d => {
    if (c.hide.indexOf(d[0]) >= 0) return;
    switch (d[0]) {
      case 'saldo': h += saldoCard(); break;
      case 'cartoes': h += cartoesCard(); break;
      case 'cat': if (DL.length) h += catCard(DL, sum(DL)); break;
      case 'sup': if (DL.length) h += barCard('sup', DL, sum(DL), 'Despesas por fornecedor', 'Quem recebeu mais, do maior para o menor.'); break;
      case 'sec': if (DL.length) h += barCard('sec', DL, sum(DL), 'Despesas por setor', 'Onde o dinheiro foi gasto, por setor.'); break;
      case 'rcat': if (RL.length) h += barCard('icat', RL, sum(RL), 'Receitas por categoria', 'De onde veio o dinheiro.'); break;
      case 'orc': h += orcCard(); break;
      case 'pagar': h += pagarCard(); break;

}

/* ---------- Lançamentos ---------- */
function dayLabel(ds) {
  if (ds === today()) return 'Hoje';
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (ds === y.getFullYear() + '-' + pad(y.getMonth() + 1) + '-' + pad(y.getDate())) return 'Ontem';
  const p = ds.split('-').map(Number), dt = new Date(p[0], p[1] - 1, p[2]);
  return cap(WD[dt.getDay()]) + ', ' + p[2] + ' de ' + MAB[p[1] - 1] + (p[0] !== now.getFullYear() ? ' de ' + p[0] : '');
}
function txRow(e) {
  const t = typ(e), meta = [];
  let t1, sign = '';
  if (t === 'transf') {
    const from = accOf(e.acc), to = e.card ? cardOf(e.card) : accOf(e.to);
    t1 = e.desc || (e.card ? 'Pagamento de fatura' : 'Transferência');
    meta.push((from ? from.name : 'Conta') + ' → ' + (to ? to.name : 'Destino'));
    if (e.fat) meta.push('Fatura ' + fatLabel(e.fat));
  } else {
    const dim = t === 'receita' ? 'icat' : 'cat', cn = norm(dim, e.cat) ? nameOf(dim, e.cat) : '';
    t1 = e.desc || cn || (t === 'receita' ? 'Receita' : 'Despesa');
    sign = t === 'receita' ? '+ ' : '− ';
    const w = e.card ? cardOf(e.card) : accOf(e.acc); if (w) meta.push(w.name);
    if (cn && e.desc) meta.push(cn);
    if (t === 'despesa') { if (norm('sup', e.sup)) meta.push(nameOf('sup', e.sup)); if (norm('sec', e.sec)) meta.push(nameOf('sec', e.sec)); }
    if (e.nt) meta.push('Parcela ' + e.n + '/' + e.nt);
    if (!e.card && e.paid === false) meta.push(e.date < today() ? 'Atrasada' : t === 'receita' ? 'A receber' : 'A pagar');
  }
  return '<button class="row" data-act="editTx" data-id="' + e.id + '"><div class="mid"><div class="t1">' + esc(t1) + '</div><div class="t2">' + esc(meta.join(' · ') || TYPES[t]) + '</div></div><span class="amt">' + sign + brl(e.cents) + '</span></button>';
}
function filtersBar() {

function lanc() {

/* ---------- backup ---------- */
function lastBk() { try { return localStorage.getItem('financas:bk') || ''; } catch (e) { return ''; } }
function payload() { return JSON.stringify({ app: 'meus-gastos', v: 1, exportedAt: new Date().toISOString(), cfg: D.cfg, expenses: D.expenses }); }
function isEmptyData() {
  return !D.expenses.length && ['pessoal', 'empresa'].every(k => ['categories', 'incomeCats', 'suppliers', 'sectors', 'accounts', 'cards', 'goals'].every(n => D.cfg[k][n].length === 0));
}
function parseBackup(text) {
  let o; try { o = JSON.parse(String(text).trim()); } catch (e) { return null; }
  if (!o || typeof o !== 'object' || !Array.isArray(o.expenses) || !o.cfg || typeof o.cfg !== 'object') return null;
  const ex = o.expenses.filter(e => e && typeof e.cents === 'number' && typeof e.date === 'string' && (e.ctx === 'pessoal' || e.ctx === 'empresa'));
  return { cfg: normCfg(o.cfg), expenses: ex.map(e => Object.assign({}, e, { id: e.id || uid() })) };
}
function stageImport(text) {
  const p = parseBackup(text);
  if (!p) { toast('Esse conteúdo não é um backup do Meus Gastos.'); return; }
  if (isEmptyData()) { applyImport(p); return; }
  S.pend = p; render();
}
function applyImport(p) {
  D.cfg = p.cfg; D.expenses = p.expenses; S.pend = null; persistLocal(); render();
  toast('Backup restaurado: ' + plural(p.expenses.length, 'lançamento', 'lançamentos') + '.');
}
function doExport() {
  const blob = new Blob([payload()], { type: 'application/json' }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'meus-gastos-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  try { localStorage.setItem('financas:bk', today()); } catch (e) {}
  render(); toast('Backup gerado. Guarde o arquivo em um lugar seguro.');
}
async function doCopy() {
  const txt = payload();
  try { await navigator.clipboard.writeText(txt); toast('Dados copiados. Cole no app instalado, em Mais > Backup.'); }
  catch (e) { const ta = $('bk-copybox'); if (ta) { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); } toast('Selecione o texto e copie.'); }
}
function bkView() {
  if (store.mode === 'db') {
    return cardWrap('Levar seus dados para o app instalado', 'Copie os dados daqui e cole no app instalado, em Mais > Backup > Importar colando o texto.',
      '<div class="btnrow"><button class="btn btn-primary" data-act="bkCopy">Copiar meus dados</button></div><textarea id="bk-copybox" readonly hidden aria-label="Dados para copiar"></textarea>');
  }
  const n = D.expenses.length, lb = lastBk();

async function saveTx(btn) {
  collectTx();
  const sh = S.sheet, v = sh.v, t = sh.t, e = sh.e;
  const cents = parseMoney(v.amount);
  if (!cents) { toast('Informe o valor.'); $('f-amount').focus(); return; }
  const date = v.date || today();
  let changed = false;
  const resolveDim = dim => {
    const f = DIMS[dim].field, x = v[f] || '';
    if (x !== '__new') return x;
    const name = (v[f + 'New'] || '').trim(); if (!name) return '';
    const ex = items(dim).find(i => i.name.toLowerCase() === name.toLowerCase());
    if (ex) return ex.id;
    changed = true; return mkItem(dim, name);
  };
  const base = { ctx: S.ctx, type: t, desc: (v.desc || '').trim(), ts: e && e.ts ? e.ts : Date.now() };
  if (e && e.grp) { base.grp = e.grp; base.n = e.n; base.nt = e.nt; }
  if (t === 'despesa') {
    base.cat = resolveDim('cat'); base.sup = resolveDim('sup'); base.sec = resolveDim('sec');
    if (v.pay.indexOf('acc:') === 0) base.acc = v.pay.slice(4); else if (v.pay.indexOf('card:') === 0) base.card = v.pay.slice(5);
  } else if (t === 'receita') {
    base.cat = resolveDim('icat');
    if (v.pay.indexOf('acc:') === 0) base.acc = v.pay.slice(4);
  } else {
    if (!v.from) { toast('Escolha a conta de origem.'); return; }
    if (!v.dest) { toast('Escolha o destino.'); return; }
    base.acc = v.from; base.paid = true;
    if (v.dest.indexOf('card:') === 0) { base.card = v.dest.slice(5); if (v.fat) base.fat = v.fat; }
    else { base.to = v.dest.slice(4); if (base.to === base.acc) { toast('Origem e destino precisam ser diferentes.'); return; } }
  }
  const td = today();
  const mk = (d, cts, i, n) => {
    const o = Object.assign({}, base, { date: d, cents: cts });
    if (t !== 'transf') o.paid = o.card ? true : (!!v.paid && d <= td);
    if (n > 1) { o.grp = base.grp || sh.grp; o.n = i + 1; o.nt = n; }
    return o;
  };
  const list = [];
  if (!e && v.rep !== 'none' && t !== 'transf') {
    const n = Math.min(60, Math.max(2, parseInt(v.reps, 10) || 2)); sh.grp = uid();
    const each = v.rep === 'inst' ? Math.floor(cents / n) : cents, rem = v.rep === 'inst' ? cents - each * n : 0;
    for (let i = 0; i < n; i++) list.push(mk(addMonths(date, i), each + (i === 0 ? rem : 0), i, n));
  } else list.push(mk(date, cents, 0, 1));
  btn.disabled = true;
  try {
    if (changed) await store.saveCfg();
    for (let i = 0; i < list.length; i++) await store.saveExpense(e ? sh.id : null, list[i]);
  } catch (err) { btn.disabled = false; toast('Não foi possível salvar. Tente de novo.'); return; }
  const p = date.split('-').map(Number);
  if (S.period === 'mes' && (p[0] !== S.y || p[1] !== S.m)) { S.y = p[0]; S.m = p[1]; }
  if (S.period === 'ano' && p[0] !== S.y) S.y = p[0];
  closeSheet(); render(); toast(list.length > 1 ? list.length + ' lançamentos salvos.' : 'Lançamento salvo.');
}

  const g0 = S.sheet.id ? cur().goals.find(x => x.id === S.sheet.id) : null;
  if (g0) Object.assign(g0, o); else cur().goals.push(Object.assign({ id: uid(), saved: 0 }, o));
  await saveCfgThen('Meta salva.');
}
async function moveGoal(sign) {
  const g = cur().goals.find(x => x.id === S.sheet.id), v = parseMoney(val('f-move'));
  if (!g) return; if (!v) { toast('Informe o valor.'); $('f-move').focus(); return; }
  g.saved = Math.max(0, (g.saved || 0) + sign * v);
  await saveCfgThen(sign > 0 ? 'Valor guardado.' : 'Valor retirado.');
}
async function deleteGoal() { cur().goals = cur().goals.filter(g => g.id !== S.sheet.id); await saveCfgThen('Meta apagada.'); }
async function saveBudget() {
  const v = parseMoney(val('f-limit'));
  if (v) cur().budgets[S.sheet.id] = v; else delete cur().budgets[S.sheet.id];
  await saveCfgThen(v ? 'Limite salvo.' : 'Limite removido.');
}
async function toggleDash(id) {
  const h = cur().hide, i = h.indexOf(id);
  if (i >= 0) h.splice(i, 1); else h.push(id);
  render();
  try { await store.saveCfg(); } catch (err) { toast('Não foi possível salvar. Tente de novo.'); }
}

/* ---------- eventos ---------- */
const DEL = { delExp: deleteTx, delGrp: deleteGrp, delItem: deleteItem, delAcc: deleteAcc, delCard: deleteCard, delGoal: deleteGoal };
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, ds = t.dataset;
  if (DEL[a]) {
    if (t.dataset.armed) DEL[a](); else { t.dataset.armed = '1'; t.textContent = 'Toque de novo para confirmar'; }
    return;
  }
  switch (a) {
    case 'ctx': S.ctx = ds.v; S.f = { type: '', cat: '', sup: '', sec: '', acc: '' }; S.more = {}; try { localStorage.setItem('financas:ctx', S.ctx); } catch (e) {} render(); break;
    case 'tab': S.tab = ds.v; render(); window.scrollTo(0, 0); break;
    case 'period': S.period = ds.v; render(); break;
    case 'shift': {
      const n = +ds.n;
      if (S.tab === 'plan' || S.period === 'mes') { S.m += n; if (S.m > 12) { S.m = 1; S.y++; } if (S.m < 1) { S.m = 12; S.y--; } }
      else if (S.period === 'ano') S.y += n;
      render(); break;
    }
    case 'drill': {
      S.f = { type: '', cat: '', sup: '', sec: '', acc: '' };
      const f = DIMS[ds.dim].field; S.f[f] = ds.id === '' ? '_' : ds.id; S.f.type = ds.dim === 'icat' ? 'receita' : 'despesa';
      S.tab = 'lanc'; render(); window.scrollTo(0, 0); break;
    }
    case 'ftype': S.f.type = ds.v; S.f.cat = ''; render(); break;
    case 'clearall': S.f = { type: '', cat: '', sup: '', sec: '', acc: '' }; render(); break;
    case 'month': S.y = +ds.y; S.m = +ds.m; S.period = 'mes'; render(); break;
    case 'more': S.more[ds.dim] = !S.more[ds.dim]; render(); break;
    case 'gocad': S.tab = 'mais'; S.cad = ds.dim; render(); window.scrollTo(0, 0); break;
    case 'cad': S.cad = ds.v || ds.dim; render(); break;
    case 'plan': S.tab = 'plan'; S.plan = ds.v; render(); window.scrollTo(0, 0); break;
    case 'newTx': openTx(null, 'despesa'); break;
    case 'editTx': openTx(ds.id); break;
    case 'settype': collectTx(); S.sheet.t = ds.v; S.sheet.v.cat = ''; S.sheet.v.pay = ''; S.sheet.v.rep = 'none'; renderTx(); break;
    case 'saveTx': saveTx(t); break;
    case 'settle': settle(ds.id); break;
    case 'payFat': { const c = cardOf(ds.card), f = fatInfo(c).find(x => x.key === ds.key); openTx(null, 'transf', { dest: 'card:' + ds.card, fat: ds.key, amount: f ? fmtIn(f.rest) : '' }); break; }
    case 'edititem': openItem(ds.id); break;
    case 'additem': addItem(); break;
    case 'saveItem': saveItem(); break;
    case 'newAcc': openAcc(null); break;
    case 'editAcc': openAcc(ds.id); break;
    case 'saveAcc': saveAcc(); break;
    case 'newCard': openCard(null); break;
    case 'editCard': openCard(ds.id); break;
    case 'saveCard': saveCard(); break;
    case 'newGoal': openGoal(null); break;
    case 'editGoal': openGoal(ds.id); break;
    case 'saveGoal': saveGoal(); break;
    case 'goalAdd': moveGoal(1); break;
    case 'goalSub': moveGoal(-1); break;
    case 'editBudget': openBudget(ds.id); break;
    case 'saveBudget': saveBudget(); break;
    case 'dash': toggleDash(ds.id); break;
    case 'bkExport': doExport(); break;
    case 'bkCopy': doCopy(); break;
    case 'bkFile': { const fi = $('bk-file'); if (fi) fi.click(); break; }
    case 'bkPaste': stageImport(val('bk-text')); break;
    case 'bkApply': if (S.pend) applyImport(S.pend); break;
    case 'bkCancel': S.pend = null; render(); break;
    case 'close': closeSheet(); break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'bk-file') {
    const f = t.files && t.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => stageImport(String(r.result)); r.onerror = () => toast('Não foi possível ler o arquivo.'); r.readAsText(f); t.value = ''; return;
  }
  if (t.dataset.filter) { S.f[t.dataset.filter] = t.value; render(); }
  else if (t.dataset.sheetsel) { const inp = $('f-' + t.dataset.sheetsel + '-new'); if (inp) { inp.hidden = t.value !== '__new'; if (t.value === '__new') inp.focus(); } }
  else if (t.dataset.rerender) { collectTx(); if (t.id === 'f-dest') S.sheet.v.fat = ''; renderTx(); }
  else if (t.dataset.fatsel) {
    const c = cardOf(val('f-dest').slice(5)), f = c ? fatInfo(c).find(x => x.key === t.value) : null;
    if (f && $('f-amount')) $('f-amount').value = fmtIn(f.rest);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheet) closeSheet();
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'add-name') addItem();
});

render();
store.init();
})();
</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
